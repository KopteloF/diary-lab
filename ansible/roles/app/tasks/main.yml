---
- name: Create user
  ansible.builtin.user:
    name: diary
    system: true
    shell: /usr/sbin/nologin
    create_home: true

- name: Setup packages
  ansible.builtin.apt:
    name:
      - python3-venv
      - postgresql-client
      - python3-pip
      - acl
    state: present
    update_cache: true

- name: Create directory
  ansible.builtin.file:
    path: /opt/diary-lab
    state: directory
    owner: diary
    group: diary
    mode: "0750"

- name: Copy requirements.txt
  ansible.builtin.copy:
    src: requirements.txt
    dest: /opt/diary-lab/requirements.txt
    owner: diary
    group: diary
    mode: "0644"

- name: Install pip
  become: true
  become_user: diary
  ansible.builtin.pip:
    requirements: /opt/diary-lab/requirements.txt
    virtualenv: /opt/diary-lab/venv
    virtualenv_command: /usr/bin/python3 -m venv
    state: present

- name: Setup templates
  ansible.builtin.template:
    src: app.env.j2
    dest: /etc/diary-lab.env
    owner: root
    group: diary
    mode: "0640"

- name: Copy app.py
  ansible.builtin.copy:
    src: app.py
    dest: /opt/diary-lab/app.py
    owner: diary
    group: diary
    mode: "0644"
  notify: Restart diary-lab

- name: Install systemd unit
  ansible.builtin.template:
    src: diary-lab.service.j2
    dest: "/etc/systemd/system/diary-lab.service"
    mode: "0644"

- name: Enable and start app
  ansible.builtin.systemd:
    name: diary-lab
    enabled: true
    state: started
    daemon_reload: true
